syntax = "proto3";
package gobale.bale.reference;
option go_package = "github.com/mimalef70/goomni/src/internal/balemeow/wire";
import "wire/bale.proto";

// Reviewed official web 5.7.0+173855, modules 18913/77108/5594.
// Peer fields here named ex_peer use ExPeer semantics (channel=3), not legacy Peer.
message ChatPeerRequest { Peer peer = 1; }
message ChatPinRequest { Peer ex_peer = 1; MessagePosition message = 2; bool just_mine = 3; }
message ChatUnpinRequest { Peer ex_peer = 1; repeated MessagePosition messages = 2; bool all = 3; }
message ChatPinsResponse { repeated HistoryItem messages = 1; }
message FolderListRequest { bool include_muted_unread_peers = 1; bool is_new_user = 2; }
message ChatFolder { int32 id = 1; string name = 2; repeated Peer peers = 3; repeated Peer unread_peers = 4; bool is_reserved = 5; }
message FolderUnreadPeer { Peer peer = 1; int64 last_message_date = 2; bool is_muted = 3; }
message FolderListResponse { repeated ChatFolder folders = 1; repeated FolderUnreadPeer unread_peers = 2; }
message FolderCreateRequest { string name = 1; repeated Peer peers = 2; }
message FolderCreateResponse { int32 folder_id = 1; int32 index = 2; repeated Peer unread_peers = 3; }
message FolderDeleteRequest { int32 folder_id = 1; }
message FolderEditRequest { int32 folder_id = 1; string name = 2; repeated Peer added_peers = 3; repeated Peer deleted_peers = 4; }
message FolderEditResponse { repeated Peer unread_peers = 1; }

// Official web client observed 2026-11-17 (modules 18913/82787, ProtectedMessage.tsx).
// The account owner's Ramz PIN is exchanged for a short-lived token with
// services_type BOT (1); the token travels only as bale_ramz_token request
// metadata of one FetchProtectedMessage call. message_id is MessageId
// {date, rid, seq}. The returned history.message is a ProtectedMessage whose
// inner message is the unlocked content. Peer is restricted to private users.
message RamzCheckPasswordRequest { string password = 1; int32 services_type = 2; }
message RamzCheckPasswordResponse { string token = 1; }
message FetchProtectedMessageRequest { ProtectedFetchPeer peer = 1; ProtectedFetchPosition message_id = 2; }
message FetchProtectedMessageResponse { HistoryItem history = 1; }

// Ramz SMS verification (official web client 2026-11-17, module 82787,
// ForgetPassword.tsx / send_otp route). When CheckPassword returns
// PERMISSION_DENIED (status 7), the client sends an empty SendOTP to deliver an
// SMS code, then ValidateOTP authorizes the account session so a later
// CheckPassword succeeds. services_type BOT (1) matches the protected-message
// unlock. otp is an int32, mirroring the client's Number(code) conversion.
message RamzValidateOTPRequest { int32 otp = 1; int32 services_type = 2; }
message RamzValidateOTPResponse { bool otp_valid = 1; }

// Extended peer and message position as serialized by ProtectedMessage.tsx.
// The web encoder writes the empty sequence string as an explicit int64 zero.
message ProtectedFetchPeer { int32 type = 1; int32 id = 2; }
message ProtectedFetchPosition { int64 date = 1; int64 rid = 2; optional int64 sequence = 3; }
